name: Naukri Auto Profile Refresh

on:
  schedule:
   # Daily Subah 7:00 AM IST (1:30 AM UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: python main.py
